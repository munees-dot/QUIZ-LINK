<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abacus Academy · Quiz Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#1b2340; --muted:#8a91aa;
    --brand:#4f46e5; --brand2:#06b6d4; --line:#e6e9f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
    padding:44px 16px 84px;text-align:center;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;
    background:rgba(255,255,255,.08);top:-180px;right:-120px}
  .tag{display:inline-block;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:30px;
    font-size:.8rem;letter-spacing:1px;font-weight:600;margin-bottom:14px}
  h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800}
  header p{opacity:.9;margin-top:8px}
  .wrap{max-width:1000px;margin:-56px auto 40px;padding:0 16px;position:relative;z-index:2}
  .stats{background:var(--card);border-radius:16px;padding:16px 20px;display:flex;justify-content:space-around;
    box-shadow:0 10px 30px rgba(27,35,64,.08);margin-bottom:20px;text-align:center}
  .stats b{display:block;font-size:1.6rem;color:var(--brand)}
  .stats span{font-size:.8rem;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .q{border-radius:14px;padding:16px 8px;text-align:center;text-decoration:none;font-weight:700;
    font-size:1rem;border:1.5px solid var(--line);transition:transform .15s,box-shadow .15s;display:block}
  .q small{display:block;font-size:.7rem;font-weight:600;margin-top:4px;letter-spacing:.5px}
  .q.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;
    box-shadow:0 6px 16px rgba(79,70,229,.25)}
  .q.on:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(79,70,229,.35)}
  .q.off{background:#eef0f6;color:#b3b8cb;cursor:not-allowed}
  .msg{text-align:center;padding:16px;color:var(--muted);font-size:.9rem}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 16px 30px}
</style>
</head>
<body>

<header>
  <div class="tag">ABACUS ACADEMY</div>
  <h1>Quiz Hub</h1>
  <p>Tap an open quiz to start</p>
</header>

<div class="wrap">
  <div class="stats">
    <div><b id="open">–</b><span>Open</span></div>
    <div><b id="locked">–</b><span>Coming soon</span></div>
  </div>
  <div class="msg" id="msg">Loading quizzes…</div>
  <div class="grid" id="grid"></div>
</div>

<footer>© Abacus Academy</footer>

<script>
/* ====== SETTINGS ====== */
const OWNER  = "munees-dot";
const REPO   = "QUIZ-LINK";
const BRANCH = "main";
const TOTAL  = 100;   // how many quiz boxes to show

/* File name must START with the number, e.g.
   1.html   01.html   quiz1.html   quiz-01.html   1-english-seedling.html  */
const NUM_RX = /^(?:quiz[-_\s]*)?0*(\d+)(?=\D|$)/i;

function draw(files){
  const grid = document.getElementById("grid");
  let open = 0, html = "";
  for (let n = 1; n <= TOTAL; n++){
    const f = files[n];
    if (f){
      open++;
      html += `<a class="q on" href="${encodeURIComponent(f)}">Quiz ${n}<small>START ▶</small></a>`;
    } else {
      html += `<div class="q off">Quiz ${n}<small>🔒 SOON</small></div>`;
    }
  }
  grid.innerHTML = html;
  document.getElementById("open").textContent = open;
  document.getElementById("locked").textContent = TOTAL - open;
}

async function load(){
  draw({});
  try{
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const files = {};
    data.filter(f => f.type === "file" && /\.html?$/i.test(f.name))
        .forEach(f => {
          const m = f.name.match(NUM_RX);
          if (m){ const n = parseInt(m[1], 10); if (!files[n]) files[n] = f.name; }
        });
    draw(files);
    document.getElementById("msg").style.display = "none";
  }catch(e){
    document.getElementById("msg").innerHTML = "⚠️ Couldn't load quizzes right now. Please refresh in a minute.";
  }
}
load();
</script>
</body>
</html>
